- include_tasks: roles/zsh/tasks/arch-linux.yml
  when: ansible_os_family == "Archlinux"
  tags:
    - dotfiles
    - install
    - zsh

- include_tasks: roles/zsh/tasks/debian.yml
  when: ansible_os_family == "Debian"
  tags:
    - dotfiles
    - install
    - zsh

- include_tasks: roles/zsh/tasks/macos.yml
  when: ansible_os_family == "Darwin"
  tags:
    - dotfiles
    - install
    - zsh

- name: Install antidote plugin manager
  ansible.builtin.git:
    repo: "https://github.com/mattmc3/antidote"
    dest: "{{ dotfiles_user_home }}/.antidote"
    depth: 1
  tags:
    - dotfiles
    - install
    - update
    - zsh

- name: Create config directories for starship and the oh-my-zsh-free zshrc
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dotfiles_user_home }}/.config"
    - "{{ zsh_next_zdotdir }}"
  tags:
    - dotfiles
    - install
    - zsh

- name: Symlink starship.toml
  file:
    src: "{{ dotfiles_home }}/roles/zsh/files/starship.toml"
    dest: "{{ dotfiles_user_home }}/.config/starship.toml"
    state: link
    force: yes
  tags:
    - dotfiles
    - install
    - zsh

# Opt-in config: start it with `ZDOTDIR={{ zsh_next_zdotdir }} zsh`.
- name: Symlink oh-my-zsh-free zshrc into its ZDOTDIR
  file:
    src: "{{ dotfiles_home }}/roles/zsh/files/zshrc.next"
    dest: "{{ zsh_next_zdotdir }}/.zshrc"
    state: link
    force: yes
  tags:
    - dotfiles
    - install
    - zsh

- name: Check for oh-my-zsh installation
  stat: "path={{ dotfiles_user_home }}/.oh-my-zsh"
  register: oh_my_zsh_stat
  tags:
    - dotfiles
    - install
    - zsh

- name: Install oh-my-zsh
  raw: 'sh -c "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"'
  when: not oh_my_zsh_stat.stat.exists
  tags:
    - dotfiles
    - install
    - zsh

- name: Install zsh-completion plugin
  ansible.builtin.git:
    repo: "https://github.com/zsh-users/zsh-completions"
    dest: "{{ dotfiles_user_home }}/.oh-my-zsh/custom/plugins/zsh-completions"
  tags:
    - dotfiles
    - install
    - update
    - zsh

- name: Install zsh-autosuggestions plugin
  ansible.builtin.git:
    repo: "https://github.com/zsh-users/zsh-autosuggestions"
    dest: "{{ dotfiles_user_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
  tags:
    - dotfiles
    - install
    - update
    - zsh

- name: Install powerlevel10k theme
  git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ dotfiles_user_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
  tags:
    - dotfiles
    - install
    - update
    - zsh

- name: Create zsh completions directory
  file:
    path: "{{ zsh_completions_dir }}"
    state: directory
    mode: "0755"
  tags:
    - dotfiles
    - install
    - update
    - zsh

- name: Generate zsh completion scripts
  command: "{{ item }} completion zsh"
  loop: "{{ zsh_completion_commands }}"
  register: zsh_completion_scripts
  changed_when: false
  failed_when: false
  tags:
    - dotfiles
    - install
    - update
    - zsh

- name: Write zsh completion files
  copy:
    content: "{{ item.stdout }}\n"
    dest: "{{ zsh_completions_dir }}/_{{ item.item }}"
    mode: "0644"
  loop: "{{ zsh_completion_scripts.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc | default(1) == 0
  tags:
    - dotfiles
    - install
    - update
    - zsh

- name: Symlink .zshrc
  file:
    src: "{{ dotfiles_home}}/roles/zsh/files/zshrc"
    dest: "{{dotfiles_user_home}}/.zshrc"
    state: link
    force: yes
  tags:
    - dotfiles
    - install
    - zsh
