- include_tasks: roles/zsh/tasks/arch-linux.yml
  when: ansible_os_family == "Archlinux"
  tags:
    - dotfiles
    - install
    - zsh

- include_tasks: roles/zsh/tasks/debian.yml
  when: ansible_os_family == "Debian"
  tags:
    - dotfiles
    - install
    - zsh

- include_tasks: roles/zsh/tasks/macos.yml
  when: ansible_os_family == "Darwin"
  tags:
    - dotfiles
    - install
    - zsh

- name: Install antidote plugin manager
  ansible.builtin.git:
    repo: "https://github.com/mattmc3/antidote"
    dest: "{{ dotfiles_user_home }}/.antidote"
    depth: 1
  tags:
    - dotfiles
    - install
    - update
    - zsh

- name: Create config directory for starship
  file:
    path: "{{ dotfiles_user_home }}/.config"
    state: directory
    mode: "0755"
  tags:
    - dotfiles
    - install
    - zsh

- name: Symlink starship.toml
  file:
    src: "{{ dotfiles_home }}/roles/zsh/files/starship.toml"
    dest: "{{ dotfiles_user_home }}/.config/starship.toml"
    state: link
    force: yes
  tags:
    - dotfiles
    - install
    - zsh

# Catppuccin theme from https://github.com/catppuccin/zsh-fsh
- name: Create fast-syntax-highlighting config directory
  file:
    path: "{{ dotfiles_user_home }}/.config/fsh"
    state: directory
    mode: "0755"
  tags:
    - dotfiles
    - install
    - zsh

- name: Symlink catppuccin fast-syntax-highlighting theme
  file:
    src: "{{ dotfiles_home }}/roles/zsh/files/fsh/{{ zsh_fsh_theme }}.ini"
    dest: "{{ dotfiles_user_home }}/.config/fsh/{{ zsh_fsh_theme }}.ini"
    state: link
    force: yes
  tags:
    - dotfiles
    - install
    - zsh

- name: Apply fast-syntax-highlighting theme
  command:
    argv:
      - zsh
      - -c
      - |
        source "$HOME/.antidote/antidote.zsh"
        antidote bundle zdharma-continuum/fast-syntax-highlighting >/dev/null
        export FAST_WORK_DIR=XDG
        source "$(antidote path zdharma-continuum/fast-syntax-highlighting)/fast-syntax-highlighting.plugin.zsh"
        fast-theme --quiet "XDG:{{ zsh_fsh_theme }}"
    creates: "{{ dotfiles_user_home }}/.cache/fsh/current_theme.zsh"
  tags:
    - dotfiles
    - install
    - zsh

- name: Create zsh completions directory
  file:
    path: "{{ zsh_completions_dir }}"
    state: directory
    mode: "0755"
  tags:
    - dotfiles
    - install
    - update
    - zsh

- name: Generate zsh completion scripts
  command: "{{ item }} completion zsh"
  loop: "{{ zsh_completion_commands }}"
  register: zsh_completion_scripts
  changed_when: false
  failed_when: false
  tags:
    - dotfiles
    - install
    - update
    - zsh

- name: Write zsh completion files
  copy:
    content: "{{ item.stdout }}\n"
    dest: "{{ zsh_completions_dir }}/_{{ item.item }}"
    mode: "0644"
  loop: "{{ zsh_completion_scripts.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc | default(1) == 0
  tags:
    - dotfiles
    - install
    - update
    - zsh

- name: Symlink .zshrc
  file:
    src: "{{ dotfiles_home }}/roles/zsh/files/zshrc"
    dest: "{{ dotfiles_user_home }}/.zshrc"
    state: link
    force: yes
  tags:
    - dotfiles
    - install
    - zsh
