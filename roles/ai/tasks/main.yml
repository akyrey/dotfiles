---
# =============================================================================
# AI Tools Setup
# =============================================================================

# =============================================================================
# Clones third-party skill repositories and symlinks a curated subset of their
# skills, agents, commands and rules (see defaults/main.yml) into the Claude
# Code and OpenCode user-level config directories.
# =============================================================================

- name: Clone AI skill repositories
  git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    force: yes
  loop: "{{ ai_skill_repos }}"
  loop_control:
    label: "{{ item.repo }}"
  tags:
    - install
    - update
    - ai

# =============================================================================
# Claude Code Setup (~/.claude/)
# =============================================================================

- name: Install Claude Code components
  block:
    # -------------------------------------------------------------------------
    # Create required directories
    # -------------------------------------------------------------------------
    - name: Create ~/.claude subdirectories
      file:
        path: "{{ dotfiles_user_home }}/.claude/{{ item }}"
        state: directory
      loop:
        - commands
        - agents
        - rules
        - skills
      tags:
        - install
        - update
        - ai

    - name: Create ~/.agents subdirectories
      file:
        path: "{{ dotfiles_user_home }}/.agents/{{ item }}"
        state: directory
      loop:
        - skills
      tags:
        - install
        - update
        - ai

    # -------------------------------------------------------------------------
    # Commands and agents: symlink individual .md files so custom ones can
    # coexist
    # -------------------------------------------------------------------------
    - name: Symlink ecc command files into ~/.claude/commands
      file:
        src: "{{ ai_ecc_dir }}/commands/{{ item }}.md"
        dest: "{{ dotfiles_user_home }}/.claude/commands/{{ item }}.md"
        state: link
        force: yes
      loop: "{{ ai_ecc_commands }}"
      tags:
        - install
        - update
        - ai

    - name: Symlink ecc agent files into ~/.claude/agents
      file:
        src: "{{ ai_ecc_dir }}/agents/{{ item }}.md"
        dest: "{{ dotfiles_user_home }}/.claude/agents/{{ item }}.md"
        state: link
        force: yes
      loop: "{{ ai_ecc_agents }}"
      tags:
        - install
        - update
        - ai

    # -------------------------------------------------------------------------
    # Rules: symlink whole subdirectories to preserve cross-references between
    # common/ and language-specific rules (files use relative paths like
    # ../common/).
    # -------------------------------------------------------------------------
    - name: Symlink ecc rules subdirectories into ~/.claude/rules
      file:
        src: "{{ ai_ecc_dir }}/rules/{{ item }}"
        dest: "{{ dotfiles_user_home }}/.claude/rules/{{ item }}"
        state: link
        force: yes
      loop: "{{ ai_ecc_rules }}"
      tags:
        - install
        - update
        - ai

    # -------------------------------------------------------------------------
    # Skills: symlink individual skill subdirectories so custom skills can
    # coexist in ~/.claude/skills/ and ~/.agents/skills/
    # -------------------------------------------------------------------------
    - name: Symlink curated skills into skill directories
      file:
        src: "{{ item.1.0.dest }}/{{ item.1.0.skills_dir }}/{{ item.1.1 }}"
        dest: "{{ item.0 }}/{{ item.1.1 | basename }}"
        state: link
        force: yes
      loop: "{{ ai_skill_link_dirs | product(ai_skill_repos | subelements('skills')) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1.1 | basename }}"
      tags:
        - install
        - update
        - ai

    # -------------------------------------------------------------------------
    # Remove symlinks into the cloned repos that are no longer listed, so
    # dropping an entry from defaults/main.yml uninstalls it
    # -------------------------------------------------------------------------
    - name: Remove unlisted symlinks into AI skill repositories
      shell: |
        while IFS= read -r link; do
          target=$(readlink "$link")
          managed=false
          for prefix in $MANAGED_PREFIXES; do
            case "$target" in "$prefix"/*) managed=true ;; esac
          done
          $managed || continue
          [[ " $KEEP " == *" $(basename "$link") "* ]] && continue
          rm "$link" && echo "removed $link"
        done < <(find "$LINK_DIR" -mindepth 1 -maxdepth 1 -type l)
      args:
        executable: /bin/bash
      # Space-separated: Jinja passes "\n" through as a literal backslash-n
      environment:
        LINK_DIR: "{{ item.0 }}"
        MANAGED_PREFIXES: "{{ ai_skill_repos | map(attribute='dest') | join(' ') }}"
        KEEP: "{{ item.1 | join(' ') }}"
      register: ai_pruned_links
      changed_when: ai_pruned_links.stdout | length > 0
      # Pairs of [directory, names to keep]
      loop: >-
        {{
          ai_skill_link_dirs
          | product([ai_skill_repos | map(attribute='skills') | flatten | map('basename') | list])
          | list
          + [
            [dotfiles_user_home ~ '/.claude/agents', ai_ecc_agents | map('regex_replace', '$', '.md') | list],
            [dotfiles_user_home ~ '/.claude/commands', ai_ecc_commands | map('regex_replace', '$', '.md') | list],
            [dotfiles_user_home ~ '/.claude/rules', ai_ecc_rules],
          ]
        }}
      loop_control:
        label: "{{ item.0 }}"
      tags:
        - install
        - update
        - ai

# =============================================================================
# OpenCode Setup (~/.opencode/)
# =============================================================================

- name: Install OpenCode components
  block:
    # -------------------------------------------------------------------------
    # Create required directories
    # -------------------------------------------------------------------------
    - name: Create ~/.opencode subdirectories
      file:
        path: "{{ dotfiles_user_home }}/.opencode/{{ item }}"
        state: directory
      loop:
        - commands
        - prompts/agents
        - instructions
        - skills
      tags:
        - install
        - update
        - ai

    # -------------------------------------------------------------------------
    # Commands: symlink individual .md files so custom commands can coexist
    # -------------------------------------------------------------------------
    - name: Find all command files in ecc/.opencode/commands
      find:
        paths: "{{ ai_ecc_dir }}/.opencode/commands"
        patterns: "*.md"
        file_type: file
      register: ecc_opencode_commands
      tags:
        - install
        - update
        - ai

    - name: Symlink ecc opencode command files into ~/.opencode/commands
      file:
        src: "{{ item.path }}"
        dest: "{{ dotfiles_user_home }}/.opencode/commands/{{ item.path | basename }}"
        state: link
        force: yes
      loop: "{{ ecc_opencode_commands.files }}"
      tags:
        - install
        - update
        - ai

    # -------------------------------------------------------------------------
    # Agents: symlink individual .txt agent prompts so custom agents can coexist
    # -------------------------------------------------------------------------
    - name: Find all agent prompt files in ecc/.opencode/prompts/agents
      find:
        paths: "{{ ai_ecc_dir }}/.opencode/prompts/agents"
        patterns: "*.txt"
        file_type: file
      register: ecc_opencode_agents
      tags:
        - install
        - update
        - ai

    - name: Symlink ecc opencode agent files into ~/.opencode/prompts/agents
      file:
        src: "{{ item.path }}"
        dest: "{{ dotfiles_user_home }}/.opencode/prompts/agents/{{ item.path | basename }}"
        state: link
        force: yes
      loop: "{{ ecc_opencode_agents.files }}"
      tags:
        - install
        - update
        - ai

    # -------------------------------------------------------------------------
    # Instructions: symlink the main instructions file
    # -------------------------------------------------------------------------
    - name: Symlink ecc opencode instructions into ~/.opencode/instructions
      file:
        src: "{{ ai_ecc_dir }}/.opencode/instructions/INSTRUCTIONS.md"
        dest: "{{ dotfiles_user_home }}/.opencode/instructions/INSTRUCTIONS.md"
        state: link
        force: yes
      tags:
        - install
        - update
        - ai

    # -------------------------------------------------------------------------
    # Skills: symlink the entire obsidian-skills directory so custom skills can
    # coexist alongside obsidian-skills skills in ~/.opencode/skills/
    # -------------------------------------------------------------------------
    - name: Symlink obsidian-skills directly into ~/.opencode/skills
      file:
        src: "{{ dotfiles_user_home }}/.obsidian-skills"
        dest: "{{ dotfiles_user_home }}/.opencode/skills/obsidian-skills"
        state: link
        force: yes
      tags:
        - install
        - update
        - ai

- name: Install my personal skills
  block:
    - name: Find all skill subdirectories in files/skills
      find:
        paths: "{{ dotfiles_home }}/roles/ai/files/skills"
        file_type: directory
        recurse: no
      register: personal_skills
      tags:
        - install
        - update
        - ai

    - name: Symlink personal skills subdirectories into ~/.claude/skills
      file:
        src: "{{ item.path }}"
        dest: "{{ dotfiles_user_home }}/.claude/skills/{{ item.path | basename }}"
        state: link
        force: yes
      loop: "{{ personal_skills.files }}"
      tags:
        - install
        - update
        - ai
